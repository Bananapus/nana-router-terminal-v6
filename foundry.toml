[profile.default]
solc = '0.8.28'
bytecode_hash = "none"
evm_version = 'cancun'
optimizer_runs = 200
via_ir = true
libs = ["node_modules", "lib"]
fs_permissions = [{ access = "read-write", path = "./"}]

[fuzz]
runs = 4096

[invariant]
runs = 1024
depth = 100
fail_on_revert = false

[lint]
# Detectors forge 1.8 added or now runs by default. They flag this codebase's intended patterns
# (hooks and terminals forward ETH to project terminals and beneficiaries, JB-prefixed struct names,
# ^0.8.0 interface pragmas) and need their own triage before they gate CI.
exclude_lints = [
  "arbitrary-send-erc20",
  "arbitrary-send-eth",
  "asm-keccak256",
  "boolean-cst",
  "calls-loop",
  "cyclomatic-complexity",
  "empty-block",
  "event-fields",
  "inline-assembly",
  "internal-function-used-once",
  "literal-instead-of-constant",
  "low-level-calls",
  "missing-events-access-control",
  "missing-zero-check",
  "pascal-case-struct",
  "pragma-inconsistent",
  "reentrancy-eth",
  "reentrancy-events",
  "reentrancy-no-eth",
  "require-revert-in-loop",
  "uninitialized-local",
  "unsafe-typecast",
  "unused-return",
]

[fmt]
number_underscore = "thousands"
multiline_func_header = "all"
wrap_comments = true

[rpc_endpoints]
base = "${RPC_BASE_MAINNET}"
ethereum = "${RPC_ETHEREUM_MAINNET}"
